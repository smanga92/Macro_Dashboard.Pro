[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = [
  "npm install --prefix backend",
  "npm rebuild better-sqlite3 --prefix backend"
]

[phases.build]
cmds = [
  "npm install --prefix frontend",
  "npm run build --prefix frontend"
]

[start]
cmd = "cd backend && npm start"
